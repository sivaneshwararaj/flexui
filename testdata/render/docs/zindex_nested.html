<!-- size: 300x200 -->
<html><head><style>
body { background-color: #ffffff; }
.ctx { position: absolute; width: 140px; height: 120px; }
.p1 { left: 20px; top: 20px; z-index: 1; background-color: #dfe8fd; }
.p2 { left: 110px; top: 50px; z-index: 2; background-color: #fde0de; }
.kid { position: absolute; width: 70px; height: 70px; }
.high { left: 60px; top: 30px; z-index: 999; background-color: #3478f6; }
.low { left: -30px; top: 40px; z-index: -5; background-color: #e6463c; }
.plain { left: 20px; top: 10px; background-color: #28aa64; }
.op { left: 100px; top: 120px; width: 120px; height: 60px; position: absolute; opacity: 0.6; background-color: #fac828; }
.op div { position: absolute; left: 20px; top: -20px; width: 40px; height: 40px; z-index: 10; background-color: #1e222a; }
</style></head><body>
<div class="ctx p1"><div class="kid high"></div></div>
<div class="ctx p2"><div class="kid low"></div><div class="kid plain"></div></div>
<div class="op"><div></div></div>
</body></html>
