<!-- size: 280x160 -->
<html><head><style>
body { background-color: #ffffff; padding: 16px; flex-direction: row; gap: 20px; }
.group { width: 110px; height: 110px; opacity: 0.5; }
.x { position: absolute; width: 70px; height: 70px; }
.blue { background-color: #3478f6; left: 0; top: 0; }
.red { background-color: #e6463c; left: 40px; top: 40px; }
.solo { width: 110px; height: 110px; }
.solo .x { opacity: 0.5; }
.nested { opacity: 0.5; position: absolute; left: 30px; top: 120px; width: 40px; height: 20px; }
.nested div { opacity: 0.5; flex: 1; background-color: #1e222a; }
</style></head><body>
<div class="group"><div class="x blue"></div><div class="x red"></div></div>
<div class="solo"><div class="x blue"></div><div class="x red"></div></div>
<div class="nested"><div></div></div>
</body></html>
