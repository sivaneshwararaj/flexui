<!-- size: 360x240 -->
<html><head><style>
body { background-color: #f4f5f7; }
.header { height: 36px; background-color: #1e222a; flex-direction: row; align-items: center; padding: 0 12px; gap: 8px; }
.logo { width: 20px; height: 20px; border-radius: 6px; background-color: #3478f6; }
.spacer { flex: 1; }
.avatar { width: 22px; height: 22px; border-radius: 50%; background-color: #fac828; }
.main { flex: 1; flex-direction: row; }
.nav { width: 70px; background-color: #ffffff; border-width: 0 1px 0 0; border-color: #dde0e5; padding: 10px 8px; gap: 8px; }
.nav div { height: 10px; border-radius: 5px; background-color: #dde0e5; }
.nav .on { background-color: #3478f6; }
.content { flex: 1; padding: 12px; gap: 12px; }
.cards { flex-direction: row; gap: 12px; }
.card { flex: 1; height: 60px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15); }
.panel { flex: 1; background-color: #ffffff; border-radius: 8px; border: 1px solid #dde0e5; }
</style></head><body>
<div class="header"><div class="logo"></div><div class="spacer"></div><div class="avatar"></div></div>
<div class="main">
  <div class="nav"><div class="on"></div><div></div><div></div><div></div></div>
  <div class="content"><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div></div><div class="panel"></div></div>
</div>
</body></html>
