<html><head><style>
body { background-color: #f4f5f7; padding: 14px; flex-direction: row; flex-wrap: wrap; gap: 14px; align-content: flex-start; }
div { width: 70px; height: 60px; background-color: #3478f6; }
.r1 { border-radius: 10px; }
.r2 { border-radius: 50%; width: 60px; background-color: #e6463c; }
.r3 { border-radius: 30px; width: 110px; background-color: #28aa64; }
.r4 { border-radius: 20px 0 20px 0; background-color: #fac828; }
.r5 { border-radius: 16px; border: 6px solid #1e222a; background-color: #ffffff; }
.r6 { border-radius: 40% 10px; background-color: #8a50d2; }
</style></head><body>
<div class="r1"></div><div class="r2"></div><div class="r3"></div>
<div class="r4"></div><div class="r5"></div><div class="r6"></div>
