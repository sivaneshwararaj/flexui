<!-- size: 300x200 -->
<html><head><style>
body { background-color: #f4f5f7; }
.frame { position: absolute; left: 30px; top: 30px; width: 140px; height: 100px; overflow: hidden; border-radius: 16px; background-color: #ffffff; border: 2px solid #1e222a; }
.over { position: absolute; left: 80px; top: 50px; width: 120px; height: 90px; z-index: 5; background-color: #3478f6; }
.under { position: absolute; left: -20px; top: 20px; width: 60px; height: 40px; z-index: -1; background-color: #e6463c; }
.sib { position: absolute; left: 150px; top: 20px; width: 100px; height: 60px; z-index: 4; background-color: #28aa64; }
.root-ctx { position: absolute; left: 200px; top: 110px; width: 80px; height: 70px; z-index: 0; background-color: #fac828; }
.root-ctx div { position: absolute; left: -40px; top: -20px; width: 50px; height: 50px; z-index: -1; background-color: #8a50d2; }
</style></head><body>
<div class="frame"><div class="over"></div><div class="under"></div></div>
<div class="sib"></div>
<div class="root-ctx"><div></div></div>
</body></html>
